     <!DOCTYPE html>
<html>
<head>
    <title>CSS Text Properties</title>
    <style>
        .text-demo {
            color: rgb(9, 9, 11);
            text-align: center;
            text-decoration: underline;
            text-transform: uppercase;
            letter-spacing: 2px;
            word-spacing: 10px;
            line-height: 1.8;
            text-indent: 30px;
            white-space: normal;
            direction: ltr;
            vertical-align: middle;
            text-shadow: 2px 2px 5px gray;
        }
    </style>
</head>
<body>

    <h1 class="text-demo">CSS Text Properties</h1>

    <p class="text-demo">
        CSS provides different text properties that control the appearance,
        spacing, alignment and decoration of text.
    </p>

</body>
</html>
</body>
</html>
