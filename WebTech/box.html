<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Model</title>

    <style>
        .box {
            width: 300px;
            padding: 70px 20px;
            border: 20px solid #3b11b9;
            margin: 50px auto;

            font-size: 20px;
            line-height: 1.5;
            box-sizing: content-box;
        }
    </style>
</head>

<body>

    <div class="box">
        This text is the content of the box. We have
        added a 50px padding, 20px.
    </div>

</body>
</html>
