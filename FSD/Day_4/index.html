<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Store Cart</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        #products-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .product {
            border: 1px solid #ccc;
            padding: 15px;
            text-align: center;
        }

        .product img {
            width: 120px;
            height: 120px;
            object-fit: contain;
        }

        button {
            margin: 5px;
            padding: 5px 10px;
            cursor: pointer;
        }

        #cart-section {
            margin-top: 40px;
            border-top: 2px solid black;
            padding-top: 20px;
        }

        .cart-item {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <h1>Fake Store</h1>

    <h2 id="cart-count">🛒 Cart: 0 items</h2>

    <div id="products-container"></div>

    <div id="cart-section">
        <h2>Cart Items</h2>
        <div id="cart-container"></div>
        <h3 id="total-price">Total: ₹0</h3>
    </div>

    <script>

        const productsContainer = document.getElementById("products-container");
        const cartContainer = document.getElementById("cart-container");
        const cartCount = document.getElementById("cart-count");
        const totalPriceElement = document.getElementById("total-price");

        let cart = JSON.parse(localStorage.getItem("cart")) || [];

        function saveCart() {
            localStorage.setItem("cart", JSON.stringify(cart));
        }

        function renderCart() {

            cartContainer.innerHTML = "";

            let totalItems = 0;
            let totalPrice = 0;

            cart.forEach(item => {

                totalItems += item.quantity;
                totalPrice += item.price * item.quantity;

                const div = document.createElement("div");
                div.classList.add("cart-item");

                div.innerHTML = `
                    <strong>${item.title}</strong><br>
                    Price: ₹${item.price}<br>
                    Quantity: ${item.quantity}
                    <hr>
                `;

                cartContainer.appendChild(div);
            });

            cartCount.innerText = `🛒 Cart: ${totalItems} items`;
            totalPriceElement.innerText =
                `Total: ₹${totalPrice.toFixed(2)}`;
        }

        renderCart();

        fetch("https://fakestoreapi.com/products")
            .then(response => response.json())
            .then(products => {

                products.forEach(product => {

                    const div = document.createElement("div");
                    div.classList.add("product");

                    const img = document.createElement("img");
                    img.src = product.image;

                    const title = document.createElement("h3");
                    title.innerText = product.title;

                    const price = document.createElement("h4");
                    price.innerText = "₹" + product.price;

                    const addBtn = document.createElement("button");
                    addBtn.innerText = "ADD";

                    const plusBtn = document.createElement("button");
                    plusBtn.innerText = "+";

                    const minusBtn = document.createElement("button");
                    minusBtn.innerText = "-";

                    let existing = cart.find(
                        item => item.id === product.id
                    );

                    let quantity = existing ? existing.quantity : 0;

                    if (quantity > 0) {
                        addBtn.innerText = `Added: ${quantity}`;
                    }

                    function updateProduct() {

                        const existingItem = cart.find(
                            item => item.id === product.id
                        );

                        if (quantity > 0) {

                            if (existingItem) {
                                existingItem.quantity = quantity;
                            } else {
                                cart.push({
                                    id: product.id,
                                    title: product.title,
                                    price: product.price,
                                    image: product.image,
                                    quantity: quantity
                                });
                            }

                            addBtn.innerText =
                                `Added: ${quantity}`;

                        } else {

                            cart = cart.filter(
                                item => item.id !== product.id
                            );

                            addBtn.innerText = "ADD";
                        }

                        saveCart();
                        renderCart();
                    }

                    addBtn.addEventListener("click", () => {
                        quantity++;
                        updateProduct();
                    });

                    plusBtn.addEventListener("click", () => {
                        quantity++;
                        updateProduct();
                    });

                    minusBtn.addEventListener("click", () => {

                        if (quantity > 0) {
                            quantity--;
                            updateProduct();
                        }
                    });

                    div.appendChild(img);
                    div.appendChild(title);
                    div.appendChild(price);
                    div.appendChild(plusBtn);
                    div.appendChild(minusBtn);
                    div.appendChild(addBtn);

                    productsContainer.appendChild(div);
                });

            })
            .catch(error => {
                console.log(error);
            });

    </script>

</body>
</html>
